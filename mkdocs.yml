site_name: KubeSCX
site_description: Kubernetes-aware programmable CPU scheduling with eBPF and sched_ext
site_url: https://vi-shub.github.io/KubeSCX/
repo_url: https://github.com/Vi-shub/KubeSCX
repo_name: Vi-shub/KubeSCX
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight

nav:
  - Home: index.md
  - Explain the project: explain.md
  - Teaching path:
      - Overview: teach/index.md
      - 1. Pod to Linux task: teach/01-pod-to-task.md
      - 2. eBPF and sched_ext: teach/02-ebpf-sched-ext.md
      - 3. Run the lab: teach/03-run-the-lab.md
      - 4. Read the counters: teach/04-read-counters.md
  - Blog:
      - First P99 result: blog/first-p99-result.md
  - Advocacy kit: advocacy.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list

plugins:
  - search
