apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-job
  namespace: kubescx-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-job
  template:
    metadata:
      labels:
        app: batch-job
        scheduling.ebpf.io/class: background
    spec:
      containers:
        - name: cpu-burn
          image: alpine:3.20
          command: ["/opt/kubescx/cpu-burn", "-workers", "4"]
          volumeMounts:
            - name: kubescx
              mountPath: /opt/kubescx
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
      volumes:
        - name: kubescx
          hostPath:
            path: /opt/kubescx
            type: Directory
